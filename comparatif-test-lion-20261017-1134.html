<!doctype html><html lang="fr"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Test LION</title>
<style>
  :root { --gold:#C8962B; --gold2:#e3b24a; --ink:#1b2130; --muted:#64708a; --line:#eceef3; }
  * { box-sizing:border-box; }
  body { font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Helvetica Neue",Arial,sans-serif;
          color:var(--ink); margin:0; padding:20px;
          background:linear-gradient(160deg,#eef1f6,#e5e9f1); }
  .card { max-width:980px; margin:0 auto; background:#fff; border-radius:18px; overflow:hidden;
           box-shadow:0 12px 36px rgba(20,30,60,.13); }
  .accent { height:5px; background:linear-gradient(90deg,var(--gold),var(--gold2)); }
  .inner { padding:26px 26px 22px; }
  header { margin-bottom:18px; }
  .brand { font-size:11.5px; letter-spacing:.16em; color:var(--gold); font-weight:800; text-transform:uppercase; }
  h1 { font-size:24px; line-height:1.2; margin:6px 0 4px; letter-spacing:-.01em; }
  .subtitle { color:var(--muted); font-size:13.5px; }
  .tablewrap { overflow-x:auto; -webkit-overflow-scrolling:touch; border:1px solid var(--line); border-radius:12px; }
  table { width:100%; border-collapse:collapse; font-size:13.5px; }
  th { background:linear-gradient(180deg,#232a3b,#1b2130); color:#fff; text-align:left;
        padding:12px 13px; font-weight:600; white-space:nowrap; font-size:12.5px; letter-spacing:.02em; }
  td { padding:13px; border-bottom:1px solid var(--line); vertical-align:middle; }
  tbody tr:last-child td { border-bottom:none; }
  tbody tr:nth-child(even) td { background:#fafbfd; }
  tr.hi td { background:#fff7e4 !important; font-weight:600; box-shadow:inset 3px 0 0 var(--gold); }
  a.opt { color:#1457c8; text-decoration:none; font-weight:700; }
  a.opt:hover { text-decoration:underline; }
  .badge { display:inline-block; background:linear-gradient(90deg,var(--gold),var(--gold2)); color:#fff;
            font-size:10px; font-weight:700; padding:3px 8px; border-radius:20px; white-space:nowrap;
            box-shadow:0 1px 3px rgba(200,150,43,.4); }
  td.act { text-align:right; white-space:nowrap; }
  a.btn { display:inline-block; background:linear-gradient(90deg,var(--gold),var(--gold2)); color:#fff;
           text-decoration:none; padding:8px 14px; border-radius:9px; font-size:12.5px; font-weight:700;
           box-shadow:0 2px 6px rgba(200,150,43,.35); transition:transform .08s ease; }
  a.btn:hover { transform:translateY(-1px); }
  .notes { margin-top:20px; font-size:12.5px; color:#44506a; background:#f7f9fc;
            border:1px solid var(--line); border-radius:12px; padding:14px 16px; }
  .notes h2 { font-size:12px; margin:0 0 8px; text-transform:uppercase; letter-spacing:.06em; color:var(--gold); }
  .notes ul { margin:0; padding-left:18px; } .notes li { margin:4px 0; }
  footer { margin-top:18px; color:#9aa3b5; font-size:11px; display:flex; justify-content:space-between; gap:10px; flex-wrap:wrap; }
  @media (max-width:520px) { body{padding:12px;} .inner{padding:18px;} h1{font-size:20px;} }
</style></head><body>
<div class="card">
  <div class="accent"></div>
  <div class="inner">
    <header>
      <div class="brand">🦁 LION · Comparatif</div>
      <h1>Test LION</h1>
      <div class="subtitle">démo</div>
    </header>
    <div class="tablewrap"><table><thead><tr><th>Option</th><th>Prix</th><th></th></tr></thead><tbody><tr class="hi"><td><a class="opt" href="https://example.com" target="_blank" rel="noopener">A</a> <span class="badge">★ Reco</span></td><td>10€</td><td class="act"><a class="btn" href="https://example.com" target="_blank" rel="noopener">Ouvrir&nbsp;↗</a></td></tr><tr><td><a class="opt" href="https://example.org" target="_blank" rel="noopener">B</a></td><td>12€</td><td class="act"><a class="btn" href="https://example.org" target="_blank" rel="noopener">Ouvrir&nbsp;↗</a></td></tr></tbody></table></div>
    <section class="notes"><h2>À noter</h2><ul><li>démo</li></ul></section>
    <footer><span>Généré par LION — 17/10/2026 11:34</span><span>test</span></footer>
  </div>
</div>
</body></html>
